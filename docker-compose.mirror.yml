# Overlay for environments where Docker Hub is blocked (e.g. mainland China).
# Public mirrors change; swap PYTHON_IMAGE if this host is unreachable.
# Usage: docker compose -f docker-compose.yml -f docker-compose.mirror.yml up --build -d
services:
  arachne:
    build:
      context: .
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
