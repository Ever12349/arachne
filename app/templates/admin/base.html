<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}arachne admin{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 15px/1.5 "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; color: #1c1917; background: #f6f4f1; }
    header { background: #1c1917; color: #fafaf9; }
    header .bar { max-width: 960px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    header a { color: #fafaf9; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    header .brand { font-weight: 650; letter-spacing: 0.01em; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }
    h1 { font-size: 1.4rem; font-weight: 650; margin: 0 0 16px; }
    h2 { font-size: 1.05rem; margin: 28px 0 10px; }
    p.note { color: #57534e; margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px 14px; }
    .card .k { color: #78716c; font-size: 12px; }
    .card .v { font-size: 1.05rem; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e7e5e4; vertical-align: top; word-break: break-all; }
    th { font-size: 12px; color: #57534e; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    a { color: #9a3412; }
    button, .btn { font: inherit; background: #1c1917; color: #fafaf9; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
    button.ghost, a.ghost { background: transparent; color: #1c1917; border: 1px solid #d6d3d1; }
    form.inline { display: inline; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #44403c; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px; border: 1px solid #d6d3d1; border-radius: 6px; background: #fff; }
    textarea { min-height: 120px; }
    pre.cmd { background: #1c1917; color: #fafaf9; padding: 12px 14px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; padding: 10px 12px; border-radius: 8px; }
    .ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; padding: 10px 12px; border-radius: 8px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    details { margin-top: 22px; background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 8px 14px 14px; }
    summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/admin">arachne {{ version }}</a>
      <a href="/admin">仪表盘</a>
      <a href="/admin/failures">最近失败</a>
      <a href="/admin/sessions">会话</a>
      <a href="/admin/sessions/new">新建会话</a>
      <a href="/admin/extract">试抽取</a>
    </div>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
